[package]
name = "alice-ledger"
version = "0.3.0"
edition = "2021"
authors = ["Moroya Sakamoto"]
description = "Order book, matching engine, and position management for financial systems"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "alice_ledger"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["std"]
std = []
# C-ABI FFI for Unity/UE5
ffi = ["std"]

[dependencies]
alice-sync = { version = "0.8.0", git = "https://github.com/ext-sakamoro/ALICE-Sync", branch = "main", features = ["telemetry"] }
alice-sign = { version = "0.1.0", git = "https://github.com/ext-sakamoro/ALICE-Sign", branch = "main" }

[dev-dependencies]
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
